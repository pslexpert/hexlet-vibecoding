<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hexlet-vibecoding</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2f9e44;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  main {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 26px;
  }
  p.subtitle {
    margin: 0 0 28px;
    color: var(--muted);
  }
  ul.projects {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  ul.projects li a {
    display: block;
    padding: 16px 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    transition: border-color 0.15s ease;
  }
  ul.projects li a:hover {
    border-color: var(--primary);
  }
  ul.projects li a span {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <h1>hexlet-vibecoding</h1>
    <p class="subtitle">Учусь вайбкодингу, тут будут мои эксперименты</p>
    <ul class="projects">
      <li>
        <a href="calorie-calculator/">
          Калькулятор калорий
          <span>Расчёт BMR, TDEE и нормы калорий по цели</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
