<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Раннер</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <div id="hud">
      <span id="score">0</span>
      <button id="pause-button" class="hidden" aria-label="Пауза">⏸</button>
      <span id="best">Рекорд: 0</span>
    </div>

    <div id="overlay">
      <h1 id="overlay-title">Раннер</h1>
      <p id="overlay-text">Тап / пробел — прыжок. Обводка заполнится — доступен двойной прыжок</p>
      <button id="overlay-button">Начать</button>
    </div>

    <div id="pause-overlay" class="hidden">
      <h1>Пауза</h1>
      <button id="resume-button">Продолжить</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
