<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор калорий</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Калькулятор калорий</h1>
    <p class="subtitle">Рассчитайте суточную норму калорий (BMR и TDEE)</p>

    <form id="calc-form">
      <div class="field">
        <span class="label">Пол</span>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="male" checked> Мужской</label>
          <label><input type="radio" name="gender" value="female"> Женский</label>
        </div>
      </div>

      <div class="field">
        <label for="age">Возраст, лет</label>
        <input type="number" id="age" min="10" max="120" value="30" required>
      </div>

      <div class="field">
        <label for="weight">Вес, кг</label>
        <input type="number" id="weight" min="20" max="400" step="0.1" value="70" required>
      </div>

      <div class="field">
        <label for="height">Рост, см</label>
        <input type="number" id="height" min="100" max="250" value="175" required>
      </div>

      <div class="field">
        <label for="activity">Уровень активности</label>
        <select id="activity">
          <option value="1.2">Минимальная (сидячий образ жизни)</option>
          <option value="1.375">Лёгкая (тренировки 1–3 раза в неделю)</option>
          <option value="1.55" selected>Средняя (тренировки 3–5 раз в неделю)</option>
          <option value="1.725">Высокая (тренировки 6–7 раз в неделю)</option>
          <option value="1.9">Очень высокая (физическая работа + тренировки)</option>
        </select>
      </div>

      <div class="field">
        <label for="goal">Цель</label>
        <select id="goal">
          <option value="lose">Снижение веса</option>
          <option value="maintain" selected>Поддержание веса</option>
          <option value="gain">Набор веса</option>
        </select>
      </div>

      <button type="submit">Рассчитать</button>
    </form>

    <section id="result" class="result hidden">
      <div class="result-row">
        <span>Базовый метаболизм (BMR)</span>
        <strong id="bmr-value">—</strong>
      </div>
      <div class="result-row">
        <span>Норма калорий для поддержания (TDEE)</span>
        <strong id="tdee-value">—</strong>
      </div>
      <div class="result-row highlight">
        <span id="goal-label">Норма калорий для вашей цели</span>
        <strong id="goal-value">—</strong>
      </div>
      <div class="macros">
        <div class="macro">
          <span>Белки</span>
          <strong id="protein-value">—</strong>
        </div>
        <div class="macro">
          <span>Жиры</span>
          <strong id="fat-value">—</strong>
        </div>
        <div class="macro">
          <span>Углеводы</span>
          <strong id="carbs-value">—</strong>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
